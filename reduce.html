<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reduce method practice</title>
  </head>
  <body>
    <h1>Reduce examples</h1>

    <script>
      // Example 1
      // Add all the numbers in an array.
      const reduceArray = [5, 2, 3, 1, 6, 11, 20];
      let max = 0;
      for (let i = 0; i < reduceArray.length; i++) {
        max = max + reduceArray[i];
      }
      console.log(max);
    </script>
  </body>
</html>
